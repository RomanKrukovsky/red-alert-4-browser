services:
  postgres:
    image: postgres:16-alpine
    container_name: ra4-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ra4user
      POSTGRES_PASSWORD: ra4pass
      POSTGRES_DB: ra4db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ra4user -d ra4db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ra4-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  game-server:
    build:
      context: .
      dockerfile: apps/game-server/Dockerfile
    container_name: ra4-game-server
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: 8080
      HOST: 0.0.0.0
      DATABASE_URL: postgres://ra4user:ra4pass@postgres:5432/ra4db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: production-jwt-secret-key-ra4
      LOG_LEVEL: info
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
